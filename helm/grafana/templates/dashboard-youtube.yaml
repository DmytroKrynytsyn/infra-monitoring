apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-monitoring-grafana-dashboard-youtube
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dashboard-youtube.json: |
    {{ `
    {
      "uid": "youtube-to-text-unit",
      "title": "app - youtube-to-text-unit",
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "Tasks Completed (per 5m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [{
            "expr": "sum by (status) (increase(youtube_tasks_total{namespace=\"youtube-to-text-unit\"}[5m]))",
            "legendFormat": "{{status}}"
          }]
        },
        {
          "id": 2,
          "title": "Task Duration p95/p99 (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(youtube_task_duration_seconds_bucket{namespace=\"youtube-to-text-unit\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(youtube_task_duration_seconds_bucket{namespace=\"youtube-to-text-unit\"}[5m])))",
              "legendFormat": "p99",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [{
            "expr": "sum by (pod) (rate(http_request_duration_seconds_count{job=\"youtube-to-text-unit\", namespace=\"youtube-to-text-unit\"}[1m]))",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 4,
          "title": "App Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
          "targets": [{
            "expr": "{layer=\"app\", namespace=\"youtube-to-text-unit\"}",
            "refId": "A"
          }],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessages": true,
            "displayedFields": ["k8s.pod.name", "_msg"]
          }
        }
      ],
      "schemaVersion": 38,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "version": 1
    }
    `}}
